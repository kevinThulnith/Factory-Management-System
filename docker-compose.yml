services:
  fms-database:
    image: postgres:14-alpine
    container_name: fms-database
    volumes:
      - fms-database-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env.prod
    networks:
      - fms-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  fms-redis:
    image: redis:7-alpine
    container_name: fms-redis
    volumes:
      - fms-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - fms-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  fms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLIENT_ID=${VITE_CLIENT_ID}
    container_name: fms-frontend
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - .env.prod
    networks:
      - fms-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  fms-proxy:
    image: nginx:1.25-alpine-slim
    container_name: fms-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media-files:/app/media
    ports:
      - "80:80"
    networks:
      - fms-network
    depends_on:
      - fms-frontend
      - fms-backend
    restart: unless-stopped
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  fms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fms-backend
    volumes:
      - media-files:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - fms-database
      - fms-redis
    networks:
      - fms-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  fms-network:
    driver: bridge

volumes:
  fms-database-data:
  fms-redis-data:
  media-files:
