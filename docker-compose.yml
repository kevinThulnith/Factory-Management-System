services:
  fms-slim-database:
    image: postgres:14-alpine
    container_name: fms-slim-database
    volumes:
      - fms-slim-slim-database-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - fms-slim-network
    restart: unless-stopped

  fms-slim-redis:
    image: redis:7-alpine
    container_name: fms-slim-redis
    volumes:
      - fms-slim-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - fms-slim-network
    restart: unless-stopped

  fms-slim-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLIENT_ID=${VITE_CLIENT_ID}
    container_name: fms-slim-frontend
    volumes:
      - frontend-dist:/frontend-dist
    env_file:
      - .env
    networks:
      - fms-slim-network
    restart: "no" # one-shot builder — exits after copying files to volume

  fms-slim-proxy:
    image: nginx:1.25-alpine-slim
    container_name: fms-slim-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - fms-slim-media-files:/app/media
    ports:
      - "80:80"
    networks:
      - fms-slim-network
    depends_on:
      fms-slim-frontend:
        condition: service_completed_successfully
      fms-slim-backend:
        condition: service_started

  fms-slim-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fms-slim-backend
    volumes:
      - fms-slim-media-files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - fms-slim-database
      - fms-slim-redis
    networks:
      - fms-slim-network
    restart: unless-stopped

networks:
  fms-slim-network:
    driver: bridge

volumes:
  fms-slim-slim-database-data:
  fms-slim-media-files:
  fms-slim-redis-data:
  frontend-dist:
